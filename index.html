<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Trace</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0d1117; color: #e6edf3; padding: 24px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #8b949e; font-size: 13px; margin-bottom: 24px; }
  .step { position: relative; padding: 0 0 20px 32px; }
  .step::before { content: ""; position: absolute; left: 9px; top: 22px; bottom: 0; width: 2px; background: #30363d; }
  .step:last-child::before { display: none; }
  .dot { position: absolute; left: 0; top: 2px; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; }
  .dot.thought { background: #1f6feb; }
  .dot.tool { background: #8957e5; }
  .dot.escalation { background: #d29922; }
  .dot.error { background: #da3633; }
  .label { font-weight: 600; font-size: 14px; }
  .meta { color: #8b949e; font-size: 12px; margin-top: 2px; }
  .detail { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 8px 12px; margin-top: 8px; font-size: 13px; color: #c9d1d9; white-space: pre-wrap; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 8px; vertical-align: middle; }
  .badge.ok { background: #1a472a; color: #3fb950; }
  .badge.error { background: #4a1a1a; color: #f85149; }
  .badge.waiting { background: #4a3a1a; color: #d29922; }
</style>
</head>
<body>
  <h1 id="title">Agent Trace</h1>
  <div class="sub" id="subtitle"></div>
  <div id="timeline"></div>
  <script>
    const icons = { thought: "💭", tool: "🔧", escalation: "✋" };
    fetch("trace.json")
      .then(r => r.json())
      .then(trace => {
        document.getElementById("title").textContent = trace.task;
        document.getElementById("subtitle").textContent =
          `${trace.agent} · ${trace.run_id} · ${trace.steps.length} steps`;
        const tl = document.getElementById("timeline");
        trace.steps.forEach(s => {
          const el = document.createElement("div");
          el.className = "step";
          const dotClass = s.status === "error" ? "error" : s.type;
          el.innerHTML = `
            <div class="dot ${dotClass}">${icons[s.type] || "•"}</div>
            <div><span class="label">${s.label}</span><span class="badge ${s.status}">${s.status}</span></div>
            <div class="meta">${s.duration_ms ? (s.duration_ms / 1000).toFixed(1) + "s" : "—"}</div>
            <div class="detail">${s.detail || ""}${s.result ? "\n→ " + s.result : ""}</div>`;
          tl.appendChild(el);
        });
      })
      .catch(() => {
        document.getElementById("timeline").innerHTML =
          "<p>Couldn't load trace.json. Serve this folder over HTTP (e.g. <code>npx serve</code>) — fetch doesn't work from file://.</p>";
      });
  </script>
</body>
</html>
